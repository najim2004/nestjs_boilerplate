services:
  postgres:
    image: postgres:17
    container_name: boilerplate_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: nestjs_boilerplate
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: boilerplate_redis
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog:latest
    container_name: boilerplate_mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  postgres_data:
